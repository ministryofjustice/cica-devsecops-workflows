name: Reusable Publish

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the archived-image artifact to download (must match the container workflow's artifact-name/image-artifact output)
        type: string
        required: false
        default: 'docker-image'
      image-name:
        description: Local tag the image was built and archived as
        type: string
        required: true
      ecr-region:
        description: AWS region the ECR repository lives in
        type: string
        required: true
      ecr-repository:
        description: ECR repository name (without registry prefix)
        type: string
        required: true
      run-container-monitor:
        description: >
          Whether to run `snyk container monitor` after publishing. The pilot only ran this
          on one specific deploy branch — since this is a generic reusable workflow with no
          knowledge of any caller's branch conventions, set this from the caller's own `if:`
          logic instead of relying on a branch name baked in here.
        type: boolean
        required: false
        default: true
      snyk-version:
        description: Pinned Snyk CLI version to install (only used if run-container-monitor is true)
        type: string
        required: false
        default: '1.1306.3'
      snyk-api-url:
        description: Snyk API base URL (only used if run-container-monitor is true)
        type: string
        required: false
        default: 'https://api.snyk.io'
    secrets:
      ECR_ROLE_TO_ASSUME:
        required: true
      ECR_REGISTRY_URL:
        required: true
      SNYK_CLIENT_ID:
        description: Only required if run-container-monitor is true
        required: false
      SNYK_CLIENT_SECRET:
        description: Only required if run-container-monitor is true
        required: false
    outputs:
      image-digest:
        description: Digest of the image pushed to ECR
        value: ${{ jobs.publish-image.outputs.image-digest }}
      image-uri:
        description: Full URI of the image pushed to ECR (registry/repository:tag)
        value: ${{ jobs.publish-image.outputs.image-uri }}

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image-digest: ${{ steps.image-digest.outputs.digest }}
      image-uri: ${{ steps.image-digest.outputs.uri }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact-name }}
      - name: Load archived Docker image
        run: docker load -i image.tar
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.ecr-region }}
      - name: Authenticate and push image to ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$ECR_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY_URL"
          docker tag "$IMAGE_NAME:latest" "$ECR_REGISTRY_URL/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY_URL/$ECR_REPOSITORY:$IMAGE_TAG"
        env:
          ECR_REGION: ${{ inputs.ecr-region }}
          ECR_REGISTRY_URL: ${{ secrets.ECR_REGISTRY_URL }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_TAG: ${{ github.sha }}
      - name: Capture published image digest
        id: image-digest
        run: |
          set -euo pipefail
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$ECR_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          if [ -z "$IMAGE_DIGEST" ] || [ "$IMAGE_DIGEST" = "None" ]; then
            echo "::error::Failed to capture ECR image digest"
            exit 1
          fi
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "uri=$ECR_REGISTRY_URL/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
        env:
          ECR_REGION: ${{ inputs.ecr-region }}
          ECR_REGISTRY_URL: ${{ secrets.ECR_REGISTRY_URL }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ github.sha }}

  artifact-attestation:
    runs-on: ubuntu-latest
    needs: publish-image
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ secrets.ECR_REGISTRY_URL }}/${{ inputs.ecr-repository }}
          subject-digest: ${{ needs.publish-image.outputs.image-digest }}

  snyk-container-monitor:
    if: inputs.run-container-monitor
    runs-on: ubuntu-latest
    needs: publish-image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact-name }}
      - name: Load archived Docker image
        run: docker load -i image.tar
      - name: Install Snyk
        run: npm install -g snyk@${{ inputs.snyk-version }}
      - name: Get Snyk OAuth token
        id: snyk-auth
        uses: ministryofjustice/cica-devsecops-workflows/actions/snyk-auth@v1.0.0
        with:
          client-id: ${{ secrets.SNYK_CLIENT_ID }}
          client-secret: ${{ secrets.SNYK_CLIENT_SECRET }}
          api-url: ${{ inputs.snyk-api-url }}
      - name: Snyk container monitor
        run: snyk container monitor ${{ inputs.image-name }}
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.snyk-auth.outputs.token }}
