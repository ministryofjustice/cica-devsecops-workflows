name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.1'
      - name: Validate workflow/action YAML syntax
        run: |
          set -euo pipefail
          FAILED=0
          while IFS= read -r FILE; do
            if npx --yes js-yaml "$FILE" > /dev/null; then
              echo "OK: $FILE"
            else
              echo "::error file=${FILE}::Invalid YAML"
              FAILED=1
            fi
          done < <(find .github/workflows actions -type f \( -name "*.yml" -o -name "*.yaml" \) | sort)
          exit $FAILED

  validate-action-pinning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate GitHub Action pinning
        run: |
          set -euo pipefail
          echo "=== CHECKING GITHUB ACTION PINNING ==="
          UNPINNED_COUNT=0
          while IFS= read -r WORKFLOW_FILE; do
            while IFS=: read -r LINE_NUMBER LINE_CONTENT; do
              ACTION_REF=$(echo "$LINE_CONTENT" | sed -nE 's/.*uses:[[:space:]]*([^[:space:]#]+).*/\1/p')
              if [ -z "$ACTION_REF" ]; then
                continue
              fi
              # Self-references to this repo's own reusable workflows/actions are governed by
              # docs/release-process.md's tag policy (a version tag like @v1.0.0 is the
              # recommended default there), not the third-party SHA-pinning policy checked below.
              if [[ "$ACTION_REF" == ministryofjustice/cica-devsecops-workflows/* ]]; then
                continue
              fi
              REF="${ACTION_REF##*@}"
              if ! echo "$REF" | grep -Eq '^[a-f0-9]{40}$'; then
                echo "::error file=${WORKFLOW_FILE},line=${LINE_NUMBER}::GitHub Action is not pinned to a full commit SHA: ${ACTION_REF}"
                UNPINNED_COUNT=$((UNPINNED_COUNT + 1))
              fi
            done < <(grep -nE 'uses:[[:space:]]*[^[:space:]#]+@[^[:space:]#]+' "$WORKFLOW_FILE" || true)
          done < <(find .github/workflows actions -type f \( -name "*.yml" -o -name "*.yaml" \) 2>/dev/null | sort)
          if [ "$UNPINNED_COUNT" -gt 0 ]; then
            echo "❌ $UNPINNED_COUNT unpinned GitHub Action reference(s) found"
            echo "All third-party GitHub Actions must be pinned to a full commit SHA."
            exit 1
          fi
          echo "✅ All third-party GitHub Actions are pinned to full commit SHAs"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --only-verified
